<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMF8829 M5 ESP32-P4 Playground</title>
    <link rel="stylesheet" href="pure-min.css">
    <link rel="stylesheet" href="grids-responsive-min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
    <div class="home-menu pure-menu pure-menu-horizontal pure-menu-fixed">
        <a class="pure-menu-heading" href="">TMF8829 M5 ESP32-P4 Playground</a>
    </div>
</div>

<div class="content-wrapper">
    <div class="content">
        <div class="pure-g">
            <div class="l-box pure-u-1 pure-u-md-1-2 pure-u-lg-1-4">
                <h3 class="content-subhead">Depth image</h3>
                <p>
                    <img id="depth-image" style="width: 420px; height: 320px; border: 1px solid silver;" src="/api/image/depth.png"
                         alt="Depth image">
                </p>
                <form class="pure-form">
                    <label for="depth-autorefresh" class="pure-checkbox switch">
                        <input id="depth-autorefresh" type="checkbox">
                        <span class="slider"></span>
                        Auto-refresh (200ms)
                    </label>
                </form>
            </div>
            <div class="l-box pure-u-1 pure-u-md-1-2 pure-u-lg-1-4">
                <h3 class="content-subhead">SNR image</h3>
                <p>
                    <img id="snr-image" style="width: 420px; height: 320px; border: 1px solid silver;" src="/api/image/snr.png"
                         alt="SNR image">
                </p>
                <form class="pure-form">
                    <label for="snr-autorefresh" class="pure-checkbox switch">
                        <input id="snr-autorefresh" type="checkbox">
                        <span class="slider"></span>
                        Auto-refresh (200ms)
                    </label>
                </form>
            </div>
            <div class="l-box pure-u-1 pure-u-md-1-2 pure-u-lg-1-2">
                <h3 class="content-subhead">Settings</h3>
                <p>
                    Phasellus eget enim eu lectus faucibus vestibulum. Suspendisse sodales pellentesque elementum.
                </p>
            </div>

        </div>
    </div>

    <div class="content">
        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-3-5">
            <h2 class="content-head">API Overview</h2>
            <ul>
                <li class="mono">GET <a href="/api/image/depth.png">/api/image/depth.png</a></li>
                <li class="mono">GET <a href="/api/image/snr.png">/api/image/snr.png</a></li>
            </ul>
        </div>
    </div>
</div>

<script>
    function setupAutoRefresh(imgId, toggleId, url, intervalMs) {
        const img = document.getElementById(imgId);
        const toggle = document.getElementById(toggleId);
        if (!img || !toggle) return;

        let timer = null;

        function scheduleNext(delay) {
            if (timer) clearTimeout(timer);
            timer = setTimeout(fetchImage, delay);
        }

        function fetchImage() {
            if (!toggle.checked) return;

            const preloader = new Image();
            const queryUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now();

            preloader.onload = function() {
                if (toggle.checked) {
                    img.src = preloader.src;
                    scheduleNext(intervalMs);
                }
            };

            preloader.onerror = function() {
                if (toggle.checked) {
                    scheduleNext(Math.max(intervalMs, 1000));
                }
            };

            preloader.src = queryUrl;
        }

        toggle.addEventListener('change', function() {
            if (this.checked) {
                fetchImage();
            } else {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        setupAutoRefresh('depth-image', 'depth-autorefresh', '/api/image/depth.png', 200);
        setupAutoRefresh('snr-image', 'snr-autorefresh', '/api/image/snr.png', 200);
    });
</script>
</body>
</html>
